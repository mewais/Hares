[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hares"
version = "0.4.0"
description = "Hares (حارس) — the guard MCP server: kernel-capped, bwrap-sandboxed filesystem, shell, and cluster tools for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mohammad Ewais", email = "mohammad.a.ewais@gmail.com" }]
keywords = ["mcp", "llm", "agents", "sandbox", "security", "guard", "bwrap", "lsf", "slurm", "hpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=1.0",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Maksab/Hares"
Repository = "https://github.com/Maksab/Hares"
Issues = "https://github.com/Maksab/Hares/issues"
Changelog = "https://github.com/Maksab/Hares/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
]

[project.scripts]
hares-mcp = "hares.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hares"]

[tool.hatch.build.targets.sdist]
# Ship the source tree minus dev / IDE / Claude-Code-session artifacts
# that hatchling would otherwise pick up by default.
exclude = [
  ".claude/",
  ".github/workflows/",  # CI is for the repo, not for sdist consumers
  "*.pyc",
  "__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
