[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hares"
version = "0.2.2"
description = "Hares (حارس) — guard MCP server: scoped, throttled, sandboxed filesystem + shell tools."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mohamed Ewais" }]
dependencies = [
  "mcp>=1.0",
  "psutil>=5.9",
  "posix_ipc>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
]

[project.scripts]
hares-mcp = "hares.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hares"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
